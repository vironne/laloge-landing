    <!-- JSON-LD FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "C'est vraiment gratuit pour mon salon ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, 100%. Ce sont les marques partenaires qui financent La Loge. Pour vous, l'inscription, le matching et les propositions sont entièrement gratuits. Pas de frais cachés, pas de commission sur vos commandes."
          }
        },
        {
          "@type": "Question",
          "name": "Comment La Loge gagne-t-elle de l'argent si c'est gratuit pour moi ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les marques nous versent une commission pour accéder à notre réseau de salons qualifiés. Cette commission est intégrée dans leurs budgets de distribution — elle ne vient jamais de votre marge. Vous payez le même prix (ou moins) qu'en direct."
          }
        },
        {
          "@type": "Question",
          "name": "Quelles marques sont disponibles ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nous travaillons avec plus de 50 marques coiffure et beauté, des marques niches et premium aux marques professionnelles reconnues. Le catalogue évolue chaque mois. Vous ne verrez que les marques pertinentes pour votre profil."
          }
        },
        {
          "@type": "Question",
          "name": "Est-ce que je dois quitter mes marques actuelles ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pas du tout. La Loge est complémentaire. Vous pouvez ajouter de nouvelles marques en parallèle de celles que vous avez déjà. Aucune exclusivité n'est demandée."
          }
        },
        {
          "@type": "Question",
          "name": "Comment sont calculées les conditions ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Votre score de salon prend en compte votre positionnement, vos spécialités, votre présence digitale, vos avis clients et votre engagement. Plus votre score est élevé, meilleures sont les conditions proposées par les marques."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce que vous faites de mes données ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vos données servent uniquement au matching avec les marques. Elles ne sont jamais revendues. Les marques ne voient votre profil détaillé que si vous acceptez une mise en relation. Vous gardez le contrôle."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps ça prend pour commencer ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "5 minutes pour créer votre profil. Vous recevez vos premières propositions de marques sous 48h. Ensuite, c'est vous qui décidez du rythme."
          }
        }
      ]
    }
    </script>
