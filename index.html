    <!-- JSON-LD Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "La Loge",
      "alternateName": "La Loge — Conciergerie des salons d'exception",
      "url": "https://www.laloge-beaute.com",
      "description": "La Loge représente les meilleurs salons de France auprès des marques premium. Conciergerie beauté mandatée par les marques, dévouée aux salons.",
      "email": "bonjour@laloge-beaute.com",
      "foundingDate": "2024",
      "areaServed": {
        "@type": "Country",
        "name": "France"
      },
      "sameAs": []
    }
    </script>

    <!-- JSON-LD FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "C'est vraiment gratuit ? Sérieusement ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Le modèle est simple : les marques premium nous versent une commission pour accéder à notre réseau de salons qualifiés. Cette commission vient de leur budget distribution — pas de votre marge. Pour vous : candidature, score, matching, négociation, accompagnement — tout est inclus. Pas de frais cachés. Pas de commission sur vos commandes. C'est structurellement gratuit."
          }
        },
        {
          "@type": "Question",
          "name": "Vous travaillez pour les marques ou pour moi ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les marques nous mandatent pour trouver les meilleurs salons — c'est elles qui financent le système. Mais notre conciergerie est À VOUS. On négocie vos conditions, on filtre les marques, on vous accompagne. Nos intérêts sont alignés avec les vôtres."
          }
        },
        {
          "@type": "Question",
          "name": "En quoi vous êtes différents d'un grossiste ou d'une marketplace ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un grossiste vous vend des produits. Une marketplace vous donne un catalogue. La Loge vous REPRÉSENTE. On est votre agent : on négocie pour vous, on filtre pour vous, on ouvre des portes pour vous."
          }
        },
        {
          "@type": "Question",
          "name": "Quelles marques sont disponibles ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Plus de 50 marques coiffure et beauté — des niches premium aux professionnelles reconnues. Le réseau s'enrichit chaque mois. On ne vous présente que celles qui correspondent à votre positionnement et votre clientèle."
          }
        },
        {
          "@type": "Question",
          "name": "Est-ce que tous les salons sont acceptés ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non, et c'est volontaire. La sélectivité est ce qui garantit la qualité du réseau — et donc les conditions exceptionnelles. Si votre candidature n'est pas retenue immédiatement, on vous donne les pistes concrètes pour améliorer votre Score et recandidater."
          }
        },
        {
          "@type": "Question",
          "name": "Est-ce que je dois quitter mes marques actuelles ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jamais. La Loge est 100 % complémentaire. On ajoute des possibilités, on ne retire rien. Aucune exclusivité demandée. Votre liberté, c'est non négociable."
          }
        },
        {
          "@type": "Question",
          "name": "Comment fonctionne le Score exactement ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L'algorithme analyse des dizaines de signaux en temps réel : vos techniques et spécialités, votre emplacement, votre positionnement prix, vos avis Google et plateformes, votre présence Instagram, l'espace et le décor de votre salon, vos marques actuelles, le profil de votre clientèle. Il croise tout ça avec les critères des marques partenaires et calcule votre indice d'attractivité."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps avant de recevoir des offres ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "5 minutes pour candidater. Score sous 24h. Premières propositions sous 48h. Ensuite, les offres arrivent en continu à chaque fois qu'une marque correspond à votre profil."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce que vous faites de mes données ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vos données servent uniquement au Score et au matching. Elles ne sont jamais revendues — à personne, jamais. Les marques ne voient votre dossier que si VOUS acceptez la mise en relation. Vous pouvez retirer votre profil à tout moment."
          }
        }
      ]
    }
    </script>
